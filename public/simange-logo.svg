<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Cyan to Emerald Gradient -->
    <linearGradient id="simangeGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" />
      <stop offset="50%" stop-color="#00f796" />
      <stop offset="100%" stop-color="#00b4d8" />
    </linearGradient>

    <!-- Emerald Bullish Gradient -->
    <linearGradient id="bullGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00f796" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#00f796" stop-opacity="1" />
    </linearGradient>

    <!-- Amber Glow Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ff3366" />
    </linearGradient>

    <!-- Filter for Cyber Glow -->
    <filter id="cyberGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- ICON BADGE (Hexagonal Cybernetic Shield) -->
  <g transform="translate(15, 10)">
    <!-- Outer Hexagon Frame -->
    <polygon points="50,2 95,26 95,74 50,98 5,74 5,26" 
             fill="#111827" 
             stroke="url(#simangeGrad1)" 
             stroke-width="2.5" 
             stroke-linejoin="round"
             filter="url(#cyberGlow)" />

    <!-- Inner Grid Pattern lines -->
    <line x1="25" y1="26" x2="75" y2="26" stroke="#243048" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="15" y1="50" x2="85" y2="50" stroke="#243048" stroke-width="1" stroke-dasharray="2 2" />
    <line x1="25" y1="74" x2="75" y2="74" stroke="#243048" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Candlestick Bar 1 (Bearish Red left) -->
    <line x1="30" y1="40" x2="30" y2="70" stroke="#ff3366" stroke-width="1.5" />
    <rect x="27" y="46" width="6" height="16" fill="#ff3366" rx="1" />

    <!-- Candlestick Bar 2 (Bullish Cyan middle) -->
    <line x1="50" y1="24" x2="50" y2="76" stroke="#00e5ff" stroke-width="1.5" />
    <rect x="47" y="32" width="6" height="32" fill="#00e5ff" rx="1" />

    <!-- Candlestick Bar 3 (Super Bullish Green right) -->
    <line x1="70" y1="14" x2="70" y2="60" stroke="#00f796" stroke-width="1.5" />
    <rect x="67" y="18" width="6" height="30" fill="#00f796" rx="1" />

    <!-- Rising Dynamic Stock Wave / S-Curve -->
    <path d="M 18,72 Q 40,78 50,50 T 82,24" 
          fill="none" 
          stroke="url(#simangeGrad1)" 
          stroke-width="3" 
          stroke-linecap="round"
          filter="url(#cyberGlow)" />

    <!-- Node circles on the wave -->
    <circle cx="18" cy="72" r="3" fill="#ff3366" />
    <circle cx="50" cy="50" r="3.5" fill="#00e5ff" />
    <circle cx="82" cy="24" r="4" fill="#00f796" filter="url(#cyberGlow)" />
  </g>

  <!-- TEXT TYPOGRAPHY -->
  <g transform="translate(130, 24)">
    <!-- Subtitle Category Tag -->
    <g transform="translate(2, 6)">
      <rect x="0" y="0" width="168" height="15" rx="3" fill="rgba(0, 229, 255, 0.12)" stroke="rgba(0, 229, 255, 0.35)" stroke-width="0.8" />
      <text x="7" y="11" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#00e5ff" letter-spacing="1.2">
        FINANCIAL MARKET TERMINAL
      </text>
    </g>

    <!-- Main Title "SIMANGE" -->
    <text x="0" y="52" 
          font-family="ui-monospace, SFMono-Regular, monospace" 
          font-size="42" 
          font-weight="900" 
          fill="#ffffff" 
          letter-spacing="5">
      SIMANGE
    </text>

    <!-- Secondary decorative subtitle -->
    <text x="2" y="72" 
          font-family="ui-monospace, SFMono-Regular, monospace" 
          font-size="10.5" 
          font-weight="600" 
          fill="#94a3b8" 
          letter-spacing="2.5">
      SIMULATION OF EXCHANGE // GPL-3.0
    </text>
  </g>
</svg>
